[package]
name = "camera-over-tailscale-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ESP32-S3 firmware: interactive setup shell, USB video (UVC) host, Tailscale node and an HTTP server that returns one camera frame"
rust-version = "1.77"

[[bin]]
name = "camera-over-tailscale-firmware"
harness = false

[profile.release]
opt-level = "s"
debug = true

[profile.dev]
opt-level = "z"
debug = true

[features]
default = []

[dependencies]
esp-idf-svc = { version = "0.52", features = ["std", "alloc", "binstart", "critical-section"] }
esp-idf-sys = "0.37"
esp-idf-hal = "0.46"
tsnode = { path = "../crates/tsnode" }
adapter-core = { path = "../crates/adapter-core" }
log = "0.4"
anyhow = "1"

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
esp_idf_tools_install_dir = "workspace"
# Default module variant; CI overrides this with ESP_IDF_SDKCONFIG_DEFAULTS.
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults", "variants/n16r8.defaults"]
extra_components = [
  { remote_component = { name = "espressif/usb_host_uvc", version = "2.5.2" }, bindings_header = "bindings.h", bindings_module = "usb" },
]
